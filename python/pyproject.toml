[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-digest"
version = "0.1.0"
description = "Reference implementation of mcp-tool-digest/v1-draft: canonical digests of MCP tool definitions"
readme = "../README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "rfc8785>=0.1.4"]

[project.scripts]
mcp-digest = "mcp_digest.__main__:main"

[tool.setuptools]
packages = ["mcp_digest"]
